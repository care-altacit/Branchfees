<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Altacit Global – Services</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      margin: 20px;
      background-color: #e3f2fd;
      text-align: center;
    }
    h1 { color: #0d47a1; }
    form { margin-bottom: 20px; }
    select, button {
      padding: 8px 12px;
      font-size: 1em;
      margin: 0 8px;
      border: 1px solid #0d47a1;
      border-radius: 4px;
      font-family: inherit;
    }
    select {
      background-color: #fff;
      color: #0d47a1;
    }
    button {
      background-color: #2196f3;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover { background-color: #1976d2; }
    #back-button {
      background-color: #0d47a1;
      color: #fff;
      margin-top: 20px;
    }
    #back-button:hover { background-color: #0b3c91; }
  </style>
</head>
<body>
  <h1>Select a Service</h1>
  <form id="service-form">
    <select id="service-select" required>
      <option value="">-- Choose your service --</option>
      <option value="INCORPORATION OF PRIVATE LIMITED COMPANY.html">Incorporation of Private Limited Company</option>
      <option value="LITIGATION SCHEDULE OF FEES.html">Litigation Schedule of Fees - India</option>
      <option value="LITIGATION SCHEDULE OF FEES-International.html">Litigation Schedule of Fees - International</option>
      <option value="arbitration.html">Arbitration Schedule of Fees</option>
 
    </select>
    <button type="submit">Submit</button>
  </form>

  <button id="back-button">Back to Selection</button>

  <script>
    document.getElementById('service-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const page = document.getElementById('service-select').value;
      if (page) window.location.href = page;
    });
    document.getElementById('back-button').addEventListener('click', function() {
      window.history.back();
    });
  </script>
</body>
</html>
