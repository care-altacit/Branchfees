<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Altacit Global – Select Branch</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      margin: 20px;
      background-color: #e3f2fd; /* light blue */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    #logo {
      max-width: 200px;
      margin-bottom: 20px;
    }
    form {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    label {
      font-size: 1.1em;
      font-weight: bold;
      color: #0d47a1;
      margin-bottom: 10px;
      display: block;
    }
    select, button {
      padding: 8px 12px;
      font-size: 1em;
      margin: 8px 0;
      border: 1px solid #0d47a1;
      border-radius: 5px;
      font-family: inherit;
      width: 100%;
      box-sizing: border-box;
    }
    select {
      background-color: #fff;
      color: #0d47a1;
      outline: none;
      transition: border-color 0.3s ease;
    }
    select:focus {
      border-color: #2196f3;
    }
    #submit-btn {
      background-color: #2196f3;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #submit-btn:hover {
      background-color: #1976d2;
    }
    #back-btn {
      background-color: #0d47a1;
      color: #fff;
      border: none;
      margin-top: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #back-btn:hover {
      background-color: #0b3c91;
    }
  </style>
</head>
<body>
  <!-- Place 'logo.png' in the same directory -->
  <img src="logo.png" alt="Altacit Global Logo" id="logo" />
  <form id="branch-form">
    <label for="branch">Select Service:</label>
    <select id="branch" name="branch" required>
      <option value="">-- Select Service --</option>
      <option value="design">DESIGN</option>
      <option value="trademark">TRADEMARK</option>
      <option value="copyright">COPYRIGHT</option>
      <option value="patent">PATENT</option>
      <option value="legal">LEGAL</option>
    </select>
    <button id="submit-btn" type="button" onclick="redirectPage()">Submit</button>
  </form>

  <script>
    function redirectPage() {
      var branch = document.getElementById("branch").value;
      if (branch === "trademark") {
        window.location.href = "bangalore_quote.html";
      } else if (branch === "design") {
        window.location.href = "Design Fee Quote.html";
      } else if (branch === "copyright") {
        window.location.href = "Copyright.html";
      } else if (branch === "patent") {
        window.location.href = "patent fees quote.html";
      
      } else if (branch === "legal") {
        window.location.href = "Legal Fee Type.html";
      } else {
        alert("Please select a Service.");
      }
    }
  </script>
</body>
</html>
